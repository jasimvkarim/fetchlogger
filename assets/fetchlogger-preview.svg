<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="900" height="520" rx="20" fill="#eef2f7"/>
  <!-- panel -->
  <g transform="translate(150,70)">
    <rect width="600" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <!-- header -->
    <rect width="600" height="40" rx="12" fill="#1e293b"/>
    <rect y="20" width="600" height="20" fill="#1e293b"/>
    <text x="16" y="26" fill="#a5b4fc" font-size="14" font-weight="bold">⠿</text>
    <rect x="40" y="9" width="92" height="22" rx="6" fill="#a5b4fc"/>
    <text x="52" y="24" fill="#0f172a" font-size="12" font-weight="bold">Network 3</text>
    <text x="146" y="24" fill="#94a3b8" font-size="12" font-weight="bold">Console 1</text>
    <text x="520" y="24" fill="#cbd5e1" font-size="12">✕ clear  ▼  ✕</text>
    <!-- rows -->
    <g font-size="13">
      <text x="16" y="72" fill="#10b981" font-weight="bold">200</text>
      <text x="60" y="72" fill="#fbbf24" font-weight="bold">GET</text>
      <text x="110" y="72" fill="#e2e8f0">/api/todos/1</text>
      <text x="520" y="72" fill="#c4b5fd">142ms</text>

      <text x="16" y="104" fill="#10b981" font-weight="bold">201</text>
      <text x="60" y="104" fill="#fbbf24" font-weight="bold">POST</text>
      <text x="110" y="104" fill="#e2e8f0">/api/login</text>
      <text x="520" y="104" fill="#c4b5fd">88ms</text>

      <text x="16" y="136" fill="#f97316" font-weight="bold">401</text>
      <text x="60" y="136" fill="#fbbf24" font-weight="bold">POST</text>
      <text x="110" y="136" fill="#e2e8f0">/api/checkout</text>
      <text x="520" y="136" fill="#c4b5fd">342ms</text>
    </g>
    <line x1="0" y1="156" x2="600" y2="156" stroke="#334155"/>
    <!-- detail -->
    <text x="16" y="182" fill="#fbbf24" font-size="12" font-weight="bold">POST</text>
    <text x="60" y="182" fill="#f97316" font-size="12" font-weight="bold">401</text>
    <text x="100" y="182" fill="#cbd5e1" font-size="12">/api/checkout</text>
    <rect x="430" y="170" width="150" height="20" rx="5" fill="#16a34a"/>
    <text x="446" y="184" fill="#fff" font-size="11" font-weight="bold">copy report ✓</text>

    <rect x="0" y="196" width="300" height="184" fill="#0d1526"/>
    <text x="16" y="214" fill="#bfdbfe" font-size="11" font-weight="bold">↑ REQUEST</text>
    <text x="16" y="234" fill="#93c5fd" font-size="11">{ "user": "demo",</text>
    <text x="16" y="250" fill="#93c5fd" font-size="11">  "password": "«redacted»" }</text>

    <text x="316" y="214" fill="#a7f3d0" font-size="11" font-weight="bold">↓ RESPONSE</text>
    <text x="316" y="234" fill="#86efac" font-size="11">{ "error":</text>
    <text x="316" y="250" fill="#86efac" font-size="11">  "Unauthorized" }</text>
  </g>
  <text x="450" y="490" fill="#475569" font-size="16" text-anchor="middle" font-family="Inter, sans-serif">Fetch Logger — a mini DevTools panel for fetch debugging, inside the browser</text>
</svg>
